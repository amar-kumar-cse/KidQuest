name: Deploy Production (Functions & Portal)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Firebase (Functions & Hosting)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Functions Dependencies & Build
        working-directory: ./Backend/functions
        run: |
          npm ci
          npm run build

      - name: Install School Portal Dependencies & Build
        working-directory: ./school-portal
        run: |
          npm ci
          npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Cloud Functions and School Portal Hosting
        id: firebase_deploy
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::warning title=Missing Secret::FIREBASE_TOKEN secret is not set in GitHub repository settings. Skipping deploy until secrets are configured."
            echo "To enable automated deployments, go to GitHub Repo -> Settings -> Secrets and variables -> Actions and add FIREBASE_TOKEN."
            exit 0
          fi
          firebase deploy --only functions,hosting,firestore:rules,firestore:indexes,storage --project "${FIREBASE_PROJECT_ID:-kidquest-45298}"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

      # ─── Slack / Discord Notifications ───────────────────────────────────────
      - name: Notify Notification Webhook on Success
        if: success()
        env:
          WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL || secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "No webhook URL configured (SLACK_WEBHOOK_URL or DISCORD_WEBHOOK_URL). Skipping notification."
            exit 0
          fi
          COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1)
          COMMIT_AUTHOR="${{ github.actor }}"
          REF_NAME="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          RUN_URL="https://github.com/${REPO}/actions/runs/${{ github.run_id }}"

          PAYLOAD=$(cat <<EOF
          {
            "text": "✅ *KidQuest Production Deployment Succeeded!*\n• *Repo*: $REPO\n• *Branch*: \`$REF_NAME\`\n• *Author*: $COMMIT_AUTHOR\n• *Commit*: $COMMIT_MSG\n• *Details*: <$RUN_URL|View Action Run>"
          }
          EOF
          )

          curl -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$WEBHOOK_URL"

      - name: Notify Notification Webhook on Failure
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL || secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "No webhook URL configured (SLACK_WEBHOOK_URL or DISCORD_WEBHOOK_URL). Skipping notification."
            exit 0
          fi
          COMMIT_AUTHOR="${{ github.actor }}"
          REF_NAME="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          RUN_URL="https://github.com/${REPO}/actions/runs/${{ github.run_id }}"

          PAYLOAD=$(cat <<EOF
          {
            "text": "❌ *KidQuest Production Deployment FAILED!*\n• *Repo*: $REPO\n• *Branch*: \`$REF_NAME\`\n• *Triggered By*: $COMMIT_AUTHOR\n• *Details*: <$RUN_URL|Inspect Deployment Logs>"
          }
          EOF
          )

          curl -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$WEBHOOK_URL"
