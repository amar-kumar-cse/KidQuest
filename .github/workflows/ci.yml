name: CI Pipeline

on:
  pull_request:
    branches: [main, master]

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # ─── Job 1: Frontend Checks ──────────────────────────────────────────────────
  frontend-checks:
    name: Frontend (Expo React Native)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'Frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./Frontend
        run: npm ci

      - name: TypeScript Type-Check
        working-directory: ./Frontend
        run: npm run type-check

      - name: ESLint
        working-directory: ./Frontend
        run: npm run lint

      - name: Jest Unit Tests with Coverage
        working-directory: ./Frontend
        run: npm run test:coverage -- --coverageReporters="text" --coverageReporters="text-summary" --coverageReporters="json-summary"

      - name: Upload Coverage Summary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-summary
          path: Frontend/coverage/coverage-summary.json
          if-no-files-found: ignore

  # ─── Job 2: Backend Checks ───────────────────────────────────────────────────
  backend-checks:
    name: Backend (Cloud Functions & Rules)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'Backend/functions/package-lock.json'

      - name: Install Functions Dependencies
        working-directory: ./Backend/functions
        run: npm ci

      - name: Functions TypeScript Type-Check
        working-directory: ./Backend/functions
        run: npx tsc --noEmit

      - name: Install Frontend Dependencies for Rules Tests
        working-directory: ./Frontend
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Run Firebase Security Rules Test Suite with Emulator
        run: |
          firebase emulators:exec --only firestore "npm --prefix Frontend test __tests__/services/taskService.test.ts"
        env:
          FIREBASE_PROJECT_ID: kidquest-ci-testing

  # ─── Job 3: School Portal Checks ─────────────────────────────────────────────
  school-portal-checks:
    name: School Portal (Web Admin)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'school-portal/package-lock.json'

      - name: Install Portal Dependencies
        working-directory: ./school-portal
        run: npm ci

      - name: TypeScript Type-Check
        working-directory: ./school-portal
        run: npx tsc -b --noEmit

      - name: Lint (Oxlint)
        working-directory: ./school-portal
        run: npm run lint

  # ─── Job 4: PR Comment with Test Coverage Summary ───────────────────────────
  pr-coverage-comment:
    name: Post Coverage Report to PR
    runs-on: ubuntu-latest
    needs: [frontend-checks, backend-checks, school-portal-checks]
    if: always() && github.event.pull_request != null

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Coverage Summary Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: frontend-coverage-summary
          path: coverage/

      - name: Format & Comment PR Coverage
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = './coverage/coverage-summary.json';

            let commentBody = '### 🎯 KidQuest CI Status\n\n';
            commentBody += '| Area | Status |\n';
            commentBody += '|---|---|\n';
            commentBody += `| **Frontend Checks** | ${{ needs.frontend-checks.result == 'success' ? '✅ Passed' : '❌ Failed' }} |\n`;
            commentBody += `| **Backend & Rules** | ${{ needs.backend-checks.result == 'success' ? '✅ Passed' : '❌ Failed' }} |\n`;
            commentBody += `| **School Portal** | ${{ needs.school-portal-checks.result == 'success' ? '✅ Passed' : '❌ Failed' }} |\n\n`;

            if (fs.existsSync(path)) {
              try {
                const summary = JSON.parse(fs.readFileSync(path, 'utf8')).total;
                commentBody += '### 📊 Frontend Jest Coverage Summary\n\n';
                commentBody += '| Metric | Percentage | Covered / Total |\n';
                commentBody += '|---|---|---|\n';
                commentBody += `| **Lines** | **${summary.lines.pct}%** | ${summary.lines.covered}/${summary.lines.total} |\n`;
                commentBody += `| **Statements** | **${summary.statements.pct}%** | ${summary.statements.covered}/${summary.statements.total} |\n`;
                commentBody += `| **Functions** | **${summary.functions.pct}%** | ${summary.functions.covered}/${summary.functions.total} |\n`;
                commentBody += `| **Branches** | **${summary.branches.pct}%** | ${summary.branches.covered}/${summary.branches.total} |\n\n`;

                const minThreshold = 60;
                const passed = summary.lines.pct >= minThreshold && summary.statements.pct >= minThreshold;
                commentBody += passed 
                  ? '> 🚀 **Coverage threshold (60%) satisfied!**'
                  : `> ⚠️ **Warning**: Test coverage is below the required 60% threshold!`;
              } catch (e) {
                commentBody += `*(Could not parse coverage summary: ${e.message})*`;
              }
            } else {
              commentBody += '*(Coverage summary file not available)*';
            }

            // Find existing bot comment to avoid spam
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c => c.user.type === 'Bot' && c.body.includes('KidQuest CI Status'));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }
