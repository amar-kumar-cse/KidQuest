name: CI & Quality Assurance

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Run Linter, Typecheck & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Monorepo Root Dependencies
        run: npm ci

      - name: Install Frontend Dependencies
        working-directory: ./Frontend
        run: npm ci

      - name: Frontend TypeScript Check
        working-directory: ./Frontend
        run: npm run type-check

      - name: Frontend Linting
        working-directory: ./Frontend
        run: npm run lint

      - name: Run Jest Unit Tests (60% Minimum Coverage Threshold)
        working-directory: ./Frontend
        run: npm run test:coverage

      - name: Upload Test Coverage Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: Frontend/coverage/

  rules-test:
    name: Test Firebase Security Rules
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Backend Dependencies
        working-directory: ./Backend/functions
        run: npm ci

      - name: Run Firestore Rules Suite with Firebase Emulator
        run: |
          firebase emulators:exec --only firestore "npm --prefix Frontend test __tests__/services"
        env:
          FIREBASE_PROJECT_ID: kidquest-ci-test

  build-and-deploy-check:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [test, rules-test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install School Portal Dependencies & Build Web
        working-directory: ./school-portal
        run: |
          npm ci
          npm run build

      - name: Build Cloud Functions (TypeScript)
        working-directory: ./Backend/functions
        run: |
          npm ci
          npm run build
