name: EAS Mobile Build & Delivery

on:
  # 1. Trigger preview build on pull requests modifying Frontend code
  pull_request:
    paths:
      - 'Frontend/**'
      - '.github/workflows/eas-build.yml'
    branches:
      - main
      - master

  # 2. Trigger production release build when version tag is pushed (e.g. v1.0.0)
  push:
    tags:
      - 'v*.*.*'

  # 3. Allow manual dispatch from GitHub Actions UI
  workflow_dispatch:
    inputs:
      environment:
        description: 'EAS Build Profile (preview | production)'
        required: true
        type: choice
        default: 'preview'
        options:
          - preview
          - production
      platform:
        description: 'Target Mobile Platform'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - android
          - ios

concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # ─── Job 1: EAS Preview Build (Pull Request) ──────────────────────────────────
  preview-build:
    name: EAS Preview Build (PR #${{ github.event.pull_request.number }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'Frontend/package-lock.json'

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Frontend Dependencies
        working-directory: ./Frontend
        run: npm ci

      - name: Run EAS Preview Build
        working-directory: ./Frontend
        run: |
          eas build --platform all --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  # ─── Job 2: EAS Production Build (Release Tag) ───────────────────────────────
  production-build:
    name: EAS Production Release (${{ github.ref_name }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'Frontend/package-lock.json'

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Frontend Dependencies
        working-directory: ./Frontend
        run: npm ci

      - name: Run EAS Production Build
        working-directory: ./Frontend
        run: |
          eas build --platform all --profile production --auto-submit --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  # ─── Job 3: Manual On-Demand Build ──────────────────────────────────────────
  manual-build:
    name: Manual EAS Build (${{ github.event.inputs.environment }} - ${{ github.event.inputs.platform }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'Frontend/package-lock.json'

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Frontend Dependencies
        working-directory: ./Frontend
        run: npm ci

      - name: Run EAS Build
        working-directory: ./Frontend
        run: |
          eas build --platform ${{ github.event.inputs.platform }} --profile ${{ github.event.inputs.environment }} --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
